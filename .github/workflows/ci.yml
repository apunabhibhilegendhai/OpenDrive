# Continuous integration.
#
# Guarantees this workflow must keep:
# - No secrets: nothing here needs a credential, and the repository must stay runnable
#   for anyone who clones it.
# - No deployment: CI verifies code. Publishing is a deliberate, separate, authorized action.
# - No long-running use of runners: every step is a bounded build or test command. Nothing
#   in this file serves traffic, proxies files or acts as a CDN — that would both break and
#   abuse the runner's terms of use.
# - Read-only token: `contents: read` is the only permission granted.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast (and loudly) instead of prompting in CI.
  CI: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported line (see .nvmrc and package.json engines). Add versions here when
        # the supported range changes; keeping one entry makes failures unambiguous.
        node: ['24']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pnpm (version comes from package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Report tool versions
        run: |
          node --version
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Unit suites only: nothing here needs a service. The suites that do (schema and
      # integration) run in the `database` job, which owns the PostgreSQL container.
      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests against the compiled API
        run: pnpm test:e2e

  database:
    name: Database suites (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two suites live here, because both make claims only a database can falsify.
    #
    #   supabase/tests      - the schema itself: every constraint rejects what it says it does,
    #                         RLS isolates tenants, credentials are stored as digests.
    #   tests/integration   - the application on top of it: real repositories, real SQL and the
    #                         real HTTP layer, proving ownership checks, credential matching and
    #                         quota reservations actually hold.
    #
    # Both scripts create and drop their own scratch database on the service below and never
    # connect to a deployed instance. Neither needs a secret: the connection is the CI-local
    # service container, so this stays a bounded, container-local test rather than a service.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis 7 mirrors the self-hosted stack (supabase-actions) so the rate
      # limiting and job-queue suites assert against the real thing. Not yet
      # consumed by any suite: the API still runs the in-process limiter until
      # the upload engine wires REDIS_URL in. The containers are provisioned now
      # so Phase 3 tests do not need another CI change.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pnpm (version comes from package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          # The supported line; the version matrix lives in the `verify` job.
          node-version: '24'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the migrations and run the SQL assertion suites
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          VERIFY_DB: opendrive_verify_ci
        run: pnpm db:verify

      - name: Run the integration suite against a scratch database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          VERIFY_DB: opendrive_verify_integration
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm db:test:integration

  audit:
    name: Dependency advisories (advisory, not gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This step reports; it does not gate. An advisory in a transitive dependency should be
    # visible in CI but must not block unrelated work, and it must never be silenced to make
    # the build look green. Failures here are expected to be triaged by a human.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
