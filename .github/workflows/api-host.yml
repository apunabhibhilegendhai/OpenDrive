# Host the OpenDrive API on a GitHub Actions runner, published over HTTPS by a Cloudflare Tunnel.
#
# This is a deliberate, operator-triggered or scheduled action — never something a push starts, and
# never part of CI. CI (`ci.yml`) stays secret-free and bounded; this workflow is the opposite: it
# needs credentials and it holds a runner for hours. Keeping the two separate is the whole point.
#
# It also runs on a schedule so the public API stays up between manual dispatches. `concurrency`
# (below) serialises runs: each scheduled run is queued and starts as the previous one ends rather
# than alongside it. Overlap is not benign — upload sessions live in the process, so two instances
# behind one tunnel would strand a multi-part upload on whichever instance did not see its start.
#
# Read docs/DEPLOYMENT.md before using it. Three things must be true first:
#   1. A reachable metadata database. The API opens a direct `postgres://` connection, so
#      `DATABASE_URL` must point at a server this runner can actually reach — not the
#      tunnel-only Supabase hostname, which exposes HTTPS but not PostgreSQL.
#   2. A Cloudflare Tunnel whose public hostname ingress maps to `http://localhost:3000`.
#   3. (Optional) Redis, for cluster-wide rate-limit counters. When `REDIS_URL` is set the runner
#      opens an Access-gated TCP tunnel to `redis-tcp.<domain>` on 127.0.0.1:6379.
#
# Hosting a multi-hour server on Actions is something GitHub's Acceptable Use Policies restrict;
# treat a run here as a development deployment, not a home for real user data.
name: API host (Cloudflare Tunnel)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to keep the API and tunnel up (5–330).'
        required: false
        default: '300'
  schedule:
    # Every four hours. A run lasts five and `concurrency` queues the next one behind it, so the
    # API stays up without a manual dispatch; the spare hour absorbs scheduler delay.
    - cron: '0 */4 * * *'

permissions:
  contents: read

concurrency:
  group: api-host
  cancel-in-progress: false

jobs:
  host:
    name: Run the API behind a Cloudflare Tunnel
    runs-on: ubuntu-latest
    # The runner ceiling is 6h; stay inside it and let the in-step timer end the run cleanly.
    timeout-minutes: 350

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pnpm (version comes from package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The API is consumed through `@opendrive/shared`'s built declarations, so the library is
      # compiled first. Only the two packages this deployment runs are built.
      - name: Build the shared library and the API
        run: |
          pnpm build:libs
          pnpm --filter @opendrive/api build

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Serve the API through the tunnel
        env:
          NODE_ENV: production
          API_HOST: 127.0.0.1
          API_PORT: '3000'
          LOG_LEVEL: info
          DOCS_ENABLED: 'true'
          # The tunnel terminates TLS; the app must trust the forwarded headers to see the caller.
          TRUST_PROXY: 'true'

          # --- Configuration that is not a secret (repository Variables) ---
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'telegram-experimental' }}
          STORAGE_MAX_FILE_SIZE_BYTES: ${{ vars.STORAGE_MAX_FILE_SIZE_BYTES }}
          STORAGE_CHUNK_SIZE_BYTES: ${{ vars.STORAGE_CHUNK_SIZE_BYTES }}
          TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
          TELEGRAM_MAX_PART_SIZE_BYTES: ${{ vars.TELEGRAM_MAX_PART_SIZE_BYTES }}
          MALWARE_SCAN_ENABLED: ${{ vars.MALWARE_SCAN_ENABLED || 'false' }}
          RATE_LIMIT_ENABLED: 'true'
          RATE_LIMIT_REQUESTS_PER_MINUTE: ${{ vars.RATE_LIMIT_REQUESTS_PER_MINUTE || '120' }}
          RATE_LIMIT_UPLOAD_PARTS_PER_MINUTE: ${{ vars.RATE_LIMIT_UPLOAD_PARTS_PER_MINUTE || '600' }}
          UPLOAD_SESSION_TTL_HOURS: ${{ vars.UPLOAD_SESSION_TTL_HOURS || '24' }}
          UPLOAD_MAX_ACTIVE_SESSIONS_PER_PRINCIPAL: ${{ vars.UPLOAD_MAX_ACTIVE_SESSIONS_PER_PRINCIPAL || '3' }}
          SUPABASE_JWT_AUDIENCE: ${{ vars.SUPABASE_JWT_AUDIENCE || 'authenticated' }}

          # --- Secrets (repository Secrets; never printed) ---
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_JWT_ISSUER: ${{ secrets.SUPABASE_JWT_ISSUER }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STORAGE_CHAT_ID: ${{ secrets.TELEGRAM_STORAGE_CHAT_ID }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          # Zero Trust service token + hostname for the Access-gated Postgres TCP tunnel.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DATABASE_TUNNEL_HOSTNAME: ${{ vars.DATABASE_TUNNEL_HOSTNAME || 'db.opendrive.indevs.in' }}
          # Access-gated raw-Redis TCP tunnel hostname (same service token as the database).
          REDIS_TUNNEL_HOSTNAME: ${{ vars.REDIS_TUNNEL_HOSTNAME || 'redis-tcp.opendrive.indevs.in' }}

          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail

          # Fail before starting anything when the two values without which hosting is meaningless
          # are absent. Coming up "healthy" while refusing every request would be worse than not
          # coming up at all.
          : "${DATABASE_URL:?set the DATABASE_URL secret (must be reachable from the runner)}"
          : "${CLOUDFLARE_TUNNEL_TOKEN:?set the CLOUDFLARE_TUNNEL_TOKEN secret}"

          # The metadata database is never exposed publicly. When a Zero Trust service
          # token is configured, open a loopback port through the Access-gated
          # `db.<domain>` tunnel and let DATABASE_URL point at 127.0.0.1:5432. Without a
          # token the tunnel stays closed and DATABASE_URL must already resolve (e.g. a
          # directly reachable Postgres on the runner's own network).
          db_tunnel_pid=""
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo "Opening the Access-gated database tunnel (${DATABASE_TUNNEL_HOSTNAME}) on 127.0.0.1:5432 ..."
            cloudflared access tcp \
              --hostname "$DATABASE_TUNNEL_HOSTNAME" \
              --url 127.0.0.1:5432 \
              --service-token-id "$CF_ACCESS_CLIENT_ID" \
              --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
              > db-tunnel.log 2>&1 &
            db_tunnel_pid=$!
            for attempt in $(seq 1 20); do
              if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
                exec 3>&- 3<&-
                echo "Database tunnel is listening after ${attempt}s."
                break
              fi
              if ! kill -0 "$db_tunnel_pid" 2>/dev/null; then
                echo "The database tunnel exited during startup:"
                cat db-tunnel.log
                exit 1
              fi
              sleep 1
            done
          fi

          # Redis is optional and shares the database tunnel's shape: an Access-gated TCP port
          # opened on loopback. With `REDIS_URL` pointing at 127.0.0.1:6379 the API's rate-limit
          # counters are shared instead of per-process. A failure here is *not* fatal: the API
          # starts anyway, falls back to in-process limits, and reports Redis in /readyz.
          redis_tunnel_pid=""
          if [ -n "${REDIS_URL:-}" ] && [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo "Opening the Access-gated Redis tunnel (${REDIS_TUNNEL_HOSTNAME}) on 127.0.0.1:6379 ..."
            cloudflared access tcp \
              --hostname "$REDIS_TUNNEL_HOSTNAME" \
              --url 127.0.0.1:6379 \
              --service-token-id "$CF_ACCESS_CLIENT_ID" \
              --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
              > redis-tunnel.log 2>&1 &
            redis_tunnel_pid=$!
            for attempt in $(seq 1 20); do
              if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null; then
                exec 3>&- 3<&-
                echo "Redis tunnel is listening after ${attempt}s."
                break
              fi
              if ! kill -0 "$redis_tunnel_pid" 2>/dev/null; then
                echo "The Redis tunnel exited during startup; continuing with in-process limits:"
                cat redis-tunnel.log
                redis_tunnel_pid=""
                break
              fi
              sleep 1
            done
          fi

          # Prove the tunnel carries a real Postgres session before the API starts, so a broken
          # tunnel is reported as such instead of surfacing as an unexplained /readyz 503. The
          # backend Supabase session is itself restarted on a schedule, so a scheduled run can
          # begin during a brief outage: retry for a few minutes before giving up.
          if [ -n "$db_tunnel_pid" ]; then
            db_ok=false
            for attempt in $(seq 1 60); do
              if node -e '
                  const postgres = require("./apps/api/node_modules/postgres");
                  const sql = postgres(process.env.DATABASE_URL, { max: 1, connect_timeout: 15, idle_timeout: 1 });
                  sql`select 1 as ok`
                    .then(async ([row]) => {
                      console.log("Database tunnel pre-flight: select 1 -> " + row.ok);
                      await sql.end();
                      process.exit(0);
                    })
                    .catch((error) => {
                      console.error("Database tunnel pre-flight failed: " + error.message);
                      process.exit(1);
                    });
                '; then
                db_ok=true
                break
              fi
              echo "Database tunnel pre-flight attempt ${attempt} failed; retrying in 3s ..."
              sleep 3
            done
            if [ "$db_ok" != true ]; then
              echo "The database tunnel did not carry a Postgres connection:"
              cat db-tunnel.log
              exit 1
            fi
          fi

          node apps/api/dist/index.js > api.log 2>&1 &
          api_pid=$!

          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" > tunnel.log 2>&1 &
          tunnel_pid=$!

          cleanup() {
            kill "$api_pid" "$tunnel_pid" \
              ${db_tunnel_pid:+"$db_tunnel_pid"} ${redis_tunnel_pid:+"$redis_tunnel_pid"} 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for the API to report ready on 127.0.0.1:3000 ..."
          ready=false
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1; then
              echo "API ready after ${attempt}s."
              ready=true
              break
            fi
            if [ "$attempt" = 1 ]; then
              # The body names the dependency that is not ok, which is the whole diagnosis.
              echo "First /readyz attempt (${attempt}) body:"
              curl -sS http://127.0.0.1:3000/readyz || true
              echo
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "The API exited during startup:"
              cat api.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "The API did not become ready within 120s. Last /readyz body:"
            curl -sS http://127.0.0.1:3000/readyz || true
            echo
            echo "===== db-tunnel.log (tail) ====="
            tail -n 50 db-tunnel.log 2>/dev/null || echo "(no db-tunnel.log)"
            echo "===== redis-tunnel.log (tail) ====="
            tail -n 50 redis-tunnel.log 2>/dev/null || echo "(no redis-tunnel.log)"
            cat api.log
            exit 1
          fi

          minutes="${DURATION_MINUTES:-300}"
          if [ "$minutes" -lt 5 ]; then minutes=5; fi
          if [ "$minutes" -gt 330 ]; then minutes=330; fi
          echo "Serving for ${minutes} minutes. The public URL is the tunnel's hostname, managed in Cloudflare Zero Trust."
          sleep $((minutes * 60))

      # Always show what the processes said: a cancelled or timed-out run still leaves the reason.
      - name: Show API and tunnel logs
        if: always()
        run: |
          echo "===== api.log (tail) ====="
          tail -n 200 api.log 2>/dev/null || echo "(no api.log)"
          echo "===== tunnel.log (tail) ====="
          tail -n 100 tunnel.log 2>/dev/null || echo "(no tunnel.log)"
          echo "===== db-tunnel.log (tail) ====="
          tail -n 50 db-tunnel.log 2>/dev/null || echo "(no db-tunnel.log)"
          echo "===== redis-tunnel.log (tail) ====="
          tail -n 50 redis-tunnel.log 2>/dev/null || echo "(no redis-tunnel.log)"
