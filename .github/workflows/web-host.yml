# Publish the OpenDrive web app to Vercel.
#
# The app is a static build that imports `@opendrive/shared` through a Vite alias, so the shared
# library is compiled first and Vercel is never asked to build the monorepo: this job produces
# `apps/web/dist` and uploads exactly that directory to the existing `opendrive` project. The SPA
# rewrite lives in `apps/web/vercel.json`, copied next to the output so a deep link resolves to
# `index.html` instead of a 404.
#
# Why not let Vercel build from the repository: a pnpm workspace needs every member's dependencies
# installed, and Vercel's install step does not carry the workspace's `packageManager`/catalog
# handling reliably. Building here keeps one toolchain (the same one CI uses) and hands Vercel a
# finished static directory.
#
# Requires these repository settings:
#   Variables: VERCEL_ORG_ID, VERCEL_PROJECT_ID, VITE_API_BASE_URL, VITE_SUPABASE_URL
#   Secrets:   VERCEL_TOKEN, VITE_SUPABASE_ANON_KEY
name: Web host (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-host.yml'

permissions:
  contents: read

concurrency:
  group: web-host
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy the web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret project identifiers; the token is what authorizes the deploy.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pnpm (version comes from package.json packageManager)
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The web app consumes `@opendrive/shared`'s built declarations through the Vite alias, so the
      # library must exist before the web build runs.
      - name: Build the shared library
        run: pnpm build:libs

      - name: Build the web app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm --filter @opendrive/web build

      # Vercel reads `vercel.json` from the root of the uploaded directory, so the committed SPA
      # rewrite has to sit beside `index.html`.
      - name: Attach the SPA rewrite to the build output
        run: cp apps/web/vercel.json apps/web/dist/vercel.json

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy apps/web/dist --prod --yes --token "$VERCEL_TOKEN"
